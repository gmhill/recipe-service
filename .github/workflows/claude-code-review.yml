name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          allowed_bots: "dependabot[bot],claude[bot],claude,github-actions[bot],github-actions"
          # In CI the session ends when Claude ends its turn, so background work never gets collected.
          claude_args: >-
            --append-system-prompt "You are running non-interactively in CI. Your session ends as soon as you end your turn, and anything still running in the background is lost. Do not run tasks or agents in the background; wait for every step to finish before ending your turn."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Report review result and blocked tool calls
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          result=$(jq -c '[.[] | select(.type == "result")] | last' "$EXECUTION_FILE")
          {
            echo "### Claude's final message"
            jq -r '.result // "(no final message)"' <<<"$result"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          denials=$(jq -c '.permission_denials // []' <<<"$result")
          if [ "$(jq 'length' <<<"$denials")" -gt 0 ]; then
            jq -r '.[] | "::error title=Blocked tool call::\(.tool_name): \(.tool_input | tostring | .[0:300])"' <<<"$denials"
            exit 1
          fi
