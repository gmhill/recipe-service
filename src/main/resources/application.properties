spring.application.name=recipe

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recipe_service}
spring.datasource.username=${DB_USERNAME:recipe_service}
spring.datasource.password=${DB_PASSWORD:recipe_service}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
